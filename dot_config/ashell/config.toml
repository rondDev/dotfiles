log_level = "warn"
outputs = { Targets = ["DP-2", "DP-3"] }
position = "Top"
app_launcher_cmd = "walker"

[modules]
left = [["appLauncher", "Updates", "Workspaces"], "MediaPlayer"]
center = ["WindowTitle"]
right = [
  "Notifications",
  "SystemInfo",
  [
    "Tray",
    "Clock",
    "Privacy",
    "Settings",
  ],
]

[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'kitty -e bash -c "paru; echo Done - Press enter to exit; read" &'

[workspaces]
enable_workspace_filling = true

[media_player]
max_title_length = 50

[system_info]
indicators = ["Cpu", "Memory", { Disk = "/" }, "Temperature"]

[clock]
format = "%a %d %b | %r"

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "walker"

[[CustomModule]]
name = "Notifications"
icon = ""
command = "swaync-client -t -sw"
listen_cmd = "swaync-client -swb"
icons.'dnd.*' = ""
alert = ".*notification"

[window_title]
truncate_title_after_length = 100

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"

[appearance]
style = "Islands"

primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"
workspace_colors = ["#b28", "#c2c"]
special_workspace_colors = ["#7aa2f7", "#9ece6a"]

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"
