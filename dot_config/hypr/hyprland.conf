#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland 
# TODO: check if this works
env = EDITOR,"emacs"
# env = EDITOR,"nvim"
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
env = LIBSEAT_BACKEND,logind
env = NVD_BACKEND,direct


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
  gaps_in = 5
  gaps_out = 20

  border_size = 2

  # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
  # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)

  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = false 

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false

  layout = dwindle
}

cursor {
  no_hardware_cursors = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 10

  # Change transparency of focused and unfocused windows
  active_opacity = 1.0
  inactive_opacity = 1.0

  # drop_shadow = true
  # shadow_range = 4
  # shadow_render_power = 3
  # col.shadow = rgba(1a1a1aee)

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 8
    passes = 2
    popups = true

    vibrancy = 0.1696
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
  # enabled = true
  enabled = false

  # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = linear, 0.0, 0.0, 1.0, 1.0 

  animation = windows, 1, 2, myBezier
  animation = windowsOut, 1, 2, default, popin 80%
  animation = border, 1, 10, default
  # animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
  animation = borderangle, 1, 100, linear, loop
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
  pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
  new_status = master
}

render {
  cm_fs_passthrough = 1
  cm_auto_hdr = 2
  send_content_type = false
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
  middle_click_paste = false
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
  kb_layout = us,no
  kb_variant =
  kb_model =
  kb_options = grp:alt_space_toggle, compose:caps
  kb_rules =

  follow_mouse = 1

  # sensitivity = -0.8 # -1.0 - 1.0, 0 means no modification.
  sensitivity = 0 # MX Master 3S -1.0 - 1.0, 0 means no modification.

  touchpad {
    natural_scroll = false
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# Outdated: 21 sept 2025
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
# bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, exec, cliphist list | $launcher | cliphist decode | wl-copy
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, Space, fullscreen
bind = $mainMod SHIFT, L, exec, systemctl suspend
bind = $mainMod, N, exec, swaync-client -t

# bind = $mainMod, o, exec, ~/.config/hypr/gamemode.sh
# bind = $mainMod, o, exec, XDG_SESSION_TYPE=x11 GBM_BACKEND=dri QT_QPA_PLATFORM=xcb  orca-slicer
bind = $mainMod, o, exec, orca-slicer

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

$cMainMod = SUPER_CONTROL
# Move active window to a workspace silently with mainMod + CTRL + [0-9]
bind = $cMainMod, 1, movetoworkspacesilent, 1
bind = $cMainMod, 2, movetoworkspacesilent, 2
bind = $cMainMod, 3, movetoworkspacesilent, 3
bind = $cMainMod, 4, movetoworkspacesilent, 4
bind = $cMainMod, 5, movetoworkspacesilent, 5
bind = $cMainMod, 6, movetoworkspacesilent, 6
bind = $cMainMod, 7, movetoworkspacesilent, 7
bind = $cMainMod, 8, movetoworkspacesilent, 8
bind = $cMainMod, 9, movetoworkspacesilent, 9
bind = $cMainMod, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, W, togglespecialworkspace, webcam
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, A, exec, pypr toggle term                  # toggles the "term" scratchpad visibility
bind = $mainMod, C, exec, pypr expose                       # exposes every window temporarily or "jump" to the fucused one
bind = $mainMod, J, exec, pypr change_workspace -1          # alternative multi-monitor workspace switcher
bind = $mainMod, K, exec, pypr change_workspace +1          # alternative multi-monitor workspace switcher
# bind = $mainMod, N, exec, pypr toggle_special minimized     # toggle a window from/to the "minimized" special workspace
# bind = $mainMod SHIFT, N, togglespecialworkspace, minimized   # toggle the "minimized" special workspace visibility
bind = $mainMod SHIFT, O, exec, pypr shift_monitors +1      # swaps workspaces between monitors
bind = $mainMod SHIFT, Z, exec, pypr zoom ++0.5             # zooms in the focused workspace
bind = $mainMod, Z, exec, pypr zoom                         # toggle zooming

# Screenshot a window
bind = $shiftMod, PRINT, exec, hyprshot --freeze -m window -o ~/.hyprshot
# Screenshot a monitor
bind = , PRINT, exec, hyprshot --freeze -m output -o ~/.hyprshot
# Screenshot a region
bind = $mainMod, PRINT, execr, ~/.local/bin/screenshot-region.sh


# Emacs Keychords
bind = $mainMod, E, submap, emacs

$reset = hyprctl dispatch submap reset &&
submap = emacs

bind = , Escape, submap, reset
# add user argument to load proper config
# bind = , E, exec, $reset emacsclient -a 'emacs -u rond' -c
bind = , E, exec, $reset emacs
bind = , C, exec, $reset emacsclient -ca 'emacs'
bind = , D, exec, $reset emacs --with-profile doom
# bind = , S, exec, $reset emacs --with-profile spacemacs
bind = , S, exec, $reset emacs --with-profile simpa --debug-init
bind = , N, exec, $reset emacs --with-profile elpaca
bind = , G, exec, $reset emacs -u rond --init-directory ~/.config/gkmacs

submap = reset

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrule = float true,match:title ^(Picture-in-Picture)$
windowrule = float true,match:title ^(steam)$
windowrule = float true,match:class ^(Rofi)$
windowrule = float true,match:class ^(Pinentry-gtk)$
windowrule = float true,match:class ^(waypaper)$
windowrule = float true,match:class ^(PortProton)$
windowrule = opacity 0.95 0.9,match:class ^(Emacs|kitty)$
# windowrulev2 = opaque,class:^(emacs)$
windowrule = border_size 0,match:class ^(Rofi)$
windowrule = workspace 5 silent,match:title ^(Steam)$
windowrule = workspace 6 silent,match:class ^(vesktop)$
windowrule = workspace 4 silent,match:class ^(virt-manager)$
windowrule = workspace special:magic,match:class ^(Spotify)$
# windowrulev2 = workspace special:webcam,class:^(com.obsproject.Studio)$
# windowrulev2 = workspace special:webcam,class:^(NoiseTorch)$
windowrule = no_blur true,match:class ^(Autodesk Fusion)$
windowrule = no_blur true,match:class ^(Xdg-desktop-portal-gtk)$
windowrule = border_size 0,match:class ^(Xdg-desktop-portal-gtk)$


windowrule = suppress_event maximize, match:class .* # You'll probably like this.
# To get more information about a window’s class, title, XWayland status or its size, you can use `hyprctl clients`. (From Hyprland Wiki)
windowrule = float true,match:class ^(one.alynx.showmethekey)$
windowrule = float true,match:class ^(showmethekey-gtk)$ # make window floating
# windowrulev2 = pin,class:^(showmethekey-gtk)$ # pin window

workspace = monitor:DP-3, 1
workspace = monitor:DP-2, 2

# workspace = 1, monitor:DP-1 persistent:true default:true
workspace = 2, defaultName:2: work
workspace = 4, defaultName:4: virt-manager
workspace = 5, defaultName:5: games
workspace = 6, defaultName:6: discord
# workspace = name:"6: discord", monitor:DP-2, default:true
# workspace = name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, decorate:false, monitor:DP-1
workspace = special:magic, on-created-empty:spotify
# workspace = special:webcam, on-created-empty:obs & noisetorch
